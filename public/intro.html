<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=605, height=1075, initial-scale=1.0, viewport-fit=cover">
  <title>🔥 VIRAL AI CHAT INTRO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      transition: opacity 0.5s ease-out;
    }

    body.fade-out {
      opacity: 0;
    }

    .container {
      width: 605px;
      height: 1075px;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .bg-gradient {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: radial-gradient(circle, #ff0066 0%, #7000ff 100%);
      opacity: 0.3;
      animation: bgPulse 4s infinite alternate;
    }

    .phone {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 375px;
      height: 667px;
      transform: translate(-50%, -50%) scale(0.95);
      background: #111;
      box-shadow: 0 0 0 6px #333, 0 10px 40px rgba(255,0,102,0.4);
      opacity: 0;
      animation: phoneEnter 0.6s ease-out 0.1s forwards, phonePulse 2s ease-in-out 1.1s infinite;
    }

    .pre-hook {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      opacity: 0;
      animation: fadeInOut 1.2s ease-in-out 0.1s forwards;
      white-space: nowrap;
    }

    .pov {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      opacity: 0;
      animation: fadeIn 0.4s ease-out 0.3s forwards;
      white-space: nowrap;
    }

    .notification {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 565px;
      background: rgba(20,20,20,0.9);
      backdrop-filter: blur(16px);
      color: white;
      padding: 16px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 6px 20px rgba(255,0,102,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      opacity: 0;
      animation: notifDropIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s forwards, vibrate 0.4s linear 1.2s;
    }

    .notification span {
      color: #ff2468;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255,36,104,0.5);
    }

    .intro-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 0 25px;
      z-index: 10;
    }

    .type {
      display: block;
      font-size: 20px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      margin-bottom: 8px;
      opacity: 0;
      animation: slideIn 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28) 0.8s forwards;
    }

    .topic {
      display: block;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.2;
      background: linear-gradient(45deg, #ff2468, #ff8a00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      animation: slideIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.1s forwards, textPulse 2s ease-in-out 2.1s infinite;
    }

    @keyframes phoneEnter {
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    @keyframes phonePulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.02); }
    }

    @keyframes notifDropIn {
      0% { transform: translateX(-50%) translateY(-30px) scale(0.9); opacity: 0; }
      70% { transform: translateX(-50%) translateY(5px) scale(1.05); }
      100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
    }

    @keyframes vibrate {
      0%, 100% { transform: translateX(-50%) translateX(0); }
      20% { transform: translateX(-50%) translateX(-2px); }
      40% { transform: translateX(-50%) translateX(2px); }
      60% { transform: translateX(-50%) translateX(-1px); }
      80% { transform: translateX(-50%) translateX(1px); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @keyframes textPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1.05); }
      50% { transform: translate(-50%, -50%) scale(1.08); }
    }

    @keyframes bgPulse {
      0% { transform: scale(1); opacity: 0.3; }
      100% { transform: scale(1.1); opacity: 0.4; }
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      20%, 80% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bg-gradient"></div>
    <div class="phone">
      <div class="pre-hook">SAG MIR NICHT ER HAT DIR UM 2 UHR GESCHRIEBEN... 😳</div>
      <div class="pov">POV: Deine Mädels reagieren auf die 2AM-Nachricht</div>
      <div class="notification">
        <span>🔥 6 KI-BERATER ANTWORTEN 🔥</span>
      </div>
      <div class="intro-text">
        <span class="type">AI SWARM REACTS TO</span>
        <span class="topic">"YOU UP?" AT 2AM</span>
      </div>
    </div>
  </div>

  <script>
    setTimeout(() => {
      document.body.classList.add('fade-out');
    }, 3200);
  </script>
</body>
</html>
