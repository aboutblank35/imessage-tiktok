<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>🔥 VIRAL AI CHAT INTRO (TikTok Optimized)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    .tiktok-container {
      width: 360px;
      height: 640px;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    /* Dynamischer Gradient-Hintergrund */
    .bg-gradient {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: radial-gradient(circle, #ff0066 0%, #7000ff 100%);
      opacity: 0.3;
      animation: bgPulse 4s infinite alternate;
    }

    /* iPhone-Mockup mit "Glow" */
    .phone {
      width: 100%;
      height: 100%;
      background: #111;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 6px #333, 0 10px 40px rgba(255,0,102,0.4);
      transform: scale(0.95);
      opacity: 0;
      animation: 
        phoneEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards,
        phonePulse 2s ease-in-out 1s infinite;
    }

    /* Notification mit Vibration */
    .notification {
      position: absolute;
      top: 60px;
      left: 20px;
      right: 20px;
      background: rgba(20,20,20,0.9);
      backdrop-filter: blur(16px);
      color: white;
      padding: 16px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 6px 20px rgba(255,0,102,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      transform: translateY(-30px) scale(0.9);
      opacity: 0;
      animation: 
        notifDropIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s forwards,
        vibrate 0.3s linear 0.9s;
    }

    .notification span {
      color: #ff2468;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255,36,104,0.5);
    }

    /* TikTok-Style Text mit Punch */
    .intro-text {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      text-align: center;
      padding: 0 25px;
      z-index: 10;
    }

    .type {
      display: block;
      font-size: 20px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      margin-bottom: 8px;
      opacity: 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      animation: textFadeIn 0.4s ease-out 0.6s forwards;
    }

    .topic {
      display: block;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.2;
      background: linear-gradient(45deg, #ff2468, #ff8a00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      text-shadow: 0 4px 12px rgba(255,36,104,0.3);
      animation: 
        textZoomIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1s forwards,
        textPulse 2s ease-in-out 2s infinite;
    }

    /* POV-Text (für CapCut) */
    .pov {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      opacity: 0;
      animation: fadeIn 0.5s ease-out 0.3s forwards;
    }

    /* Animationen */
    @keyframes phoneEnter {
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes phonePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @keyframes notifDropIn {
      0% { transform: translateY(-30px) scale(0.9); opacity: 0; }
      70% { transform: translateY(5px) scale(1.05); }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes vibrate {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-2px); }
      40% { transform: translateX(2px); }
      60% { transform: translateX(-1px); }
      80% { transform: translateX(1px); }
    }

    @keyframes textFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes textZoomIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.05); }
    }

    @keyframes textPulse {
      0%, 100% { transform: scale(1.05); }
      50% { transform: scale(1.08); }
    }

    @keyframes bgPulse {
      0% { transform: scale(1); opacity: 0.3; }
      100% { transform: scale(1.1); opacity: 0.4; }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="tiktok-container">
    <div class="bg-gradient"></div>
    <div class="phone">
      <div class="pov">POV: Deine Mädels sehen die 2AM-Nachricht...</div>
      <div class="notification">
        New message from <span>BLAZE🔥</span>
      </div>
      <div class="intro-text">
        <span class="type">AI GROUP CHAT REACTS TO...</span>
        <span class="topic">"HE TEXTED 'YOU UP?' AT 2AM"</span>
      </div>
    </div>
  </div>

  <script>
    // Übergang nach 2.5 Sekunden (für CapCut)
    setTimeout(() => {
      document.body.style.opacity = '0';
    }, 2500);
  </script>
</body>
</html>
