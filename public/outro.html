<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 CHAT REACTIONS</title>
  <style>
    :root {
      --primary: #ff1a75;
      --secondary: #00ccff;
    }
    
    body {
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    
    .container {
      width: 100vw;
      height: 177.78vw;
      max-width: 562.5px;
      max-height: 1000px;
      position: relative;
      overflow: hidden;
    }
    
    .content {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }
    
    .logo {
      width: 70px;
      height: 70px;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 32px;
      color: white;
      margin-bottom: 20px;
      opacity: 0;
      transform: scale(0.5);
      animation: popIn 0.6s 0.3s forwards;
    }
    
    .headline {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 15px;
      opacity: 0;
      transform: translateY(20px);
      animation: slideUp 0.5s 0.6s forwards;
    }
    
    .prompt {
      font-size: 16px;
      color: rgba(255,255,255,0.9);
      max-width: 80%;
      margin-bottom: 25px;
      opacity: 0;
      transform: translateY(20px);
      animation: slideUp 0.5s 0.8s forwards;
    }
    
    .highlight {
      color: var(--primary);
      font-weight: 600;
    }
    
    .swipe-hint {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      animation: pulse 2s infinite;
    }
    
    @keyframes popIn {
      to { opacity: 1; transform: scale(1); }
    }
    
    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="logo">AI</div>
      <h1 class="headline" id="headline">DISCUSS THIS!</h1>
      <p class="prompt" id="discussionPrompt">Loading conversation highlights...</p>
    </div>
    <div class="swipe-hint">↓ SWIPE FOR MORE VIRAL CHATS ↓</div>
  </div>

  <script>
    // Dynamic content generator
    const discussionPrompts = [
      "Who had the best take? <span class='highlight'>COMMENT</span> below!",
      "Would YOU have responded differently? <span class='highlight'>DEBATE</span>!",
      "Tag someone who <span class='highlight'>always texts late</span>!",
      "Which reaction was <span class='highlight'>most relatable</span>?",
      "Who was being <span class='highlight'>too dramatic</span> here?"
    ];
    
    const controversyTriggers = [
      "SPICY DEBATE", "HOT TAKE ALERT", "WHO'S RIGHT?", "DRAMA UNFOLDS", "CHAOS MODE"
    ];
    
    // Analyze URL parameters for dynamic content
    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get('theme') || 'default';
    
    // Set dynamic colors
    if (theme === 'drama') {
      document.documentElement.style.setProperty('--primary', '#ff1a75');
      document.documentElement.style.setProperty('--secondary', '#ff8a00');
    } else if (theme === 'debate') {
      document.documentElement.style.setProperty('--primary', '#00b8ff');
      document.documentElement.style.setProperty('--secondary', '#00ffaa');
    }
    
    // Rotate prompts every 3 seconds
    let promptIndex = 0;
    const promptElement = document.getElementById('discussionPrompt');
    const headlineElement = document.getElementById('headline');
    
    function updatePrompt() {
      promptIndex = (promptIndex + 1) % discussionPrompts.length;
      promptElement.innerHTML = discussionPrompts[promptIndex];
      headlineElement.textContent = controversyTriggers[promptIndex];
      
      // Random timing for psychological effect
      const nextDelay = 2500 + Math.random() * 2000;
      setTimeout(updatePrompt, nextDelay);
    }
    
    // Auto-advance after 5 seconds
    setTimeout(() => {
      document.body.style.opacity = '0';
      // Puppeteer transition would happen here
    }, 5000);
    
    // Initialize
    window.onload = () => {
      setTimeout(updatePrompt, 3000);
      
      // Dynamic emoji injection
      promptElement.innerHTML = promptElement.innerHTML.replace(
        "Loading conversation highlights...", 
        discussionPrompts[0]
      );
      headlineElement.textContent = controversyTriggers[0];
    };
  </script>
</body>
</html>
