<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Outro (1080×1920)</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* === Layout: zentriert & clean === */
    .outro-wrap{
      position:absolute; inset:0;
      display:grid; place-items:center;
      padding:56px;
      background:#0B0E12;
      overflow:hidden;
      isolation:isolate;
    }

    /* subtile Vignette */
    .outro-wrap::after{
      content:"";
      position:absolute; inset:-2%;
      pointer-events:none; z-index:0;
      background:
        radial-gradient(120% 90% at 50% 12%, rgba(255,255,255,.08), rgba(255,255,255,0) 60%),
        radial-gradient(120% 90% at 50% 88%, rgba(255,255,255,.06), rgba(255,255,255,0) 60%);
      mix-blend-mode:screen;
      opacity:.7;
    }

    /* Orbs (Farbflairs) */
    .orb{
      position:absolute; z-index:0;
      width:560px; height:560px; border-radius:50%;
      filter:blur(70px); opacity:.33; mix-blend:screen;
    }
    .o1{ left:-140px; top:-100px;
         background:radial-gradient(circle at 30% 30%, #7c3aed, #111);
         animation:float 7s ease-in-out infinite alternate; }
    .o2{ right:-160px; bottom:8%;
         background:radial-gradient(circle at 60% 40%, #06b6d4, #111);
         animation:float 8.5s ease-in-out infinite alternate; }

    /* CTA-Stack */
    .cta{
      position:relative; z-index:2;
      width:min(820px, 86%);
      display:grid; gap:24px;
      text-align:center;
      transform:translateY(-2%); /* optische Mitte */
    }

    .badge{
      margin:0 auto;
      display:inline-block;
      padding:12px 20px;
      font-size:22px; font-weight:900; color:#fff;
      background:#2F6DF6;
      border-radius:999px;
      box-shadow:0 18px 38px rgba(47,109,246,.35);
      opacity:0; transform:translateY(8px) scale(.98);
      animation:
        pop .26s ease-out .15s forwards,
        glow 2.6s ease-in-out 1s infinite alternate;
    }

    .cta-bubble{
      position:relative;
      padding:24px 30px;
      border-radius:28px;
      font-weight:900; font-size:44px; line-height:1.15;
      color:#0B0E12; background:#3CE6B0;
      box-shadow:0 28px 60px rgba(60,230,176,.25);
      opacity:0; transform:translateY(12px) scale(.98);
      animation:pop .28s cubic-bezier(.2,.8,.2,1) .35s forwards;
      overflow:hidden;
    }
    /* Shimmer über der Haupt-CTA */
    .cta-bubble::after{
      content:"";
      position:absolute; inset:0;
      background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,.28) 20%, transparent 40%);
      transform:translateX(-120%);
      animation:shimmer 1.6s ease 1.1s both;
      pointer-events:none;
    }

    .cta-bubble.small{
      background:#F2F5F8; color:#0B0E12; font-weight:800; font-size:36px;
      animation-delay:.95s;
    }

    .rail{
      font-size:22px; color:#cbd5e1; letter-spacing:.2px;
      opacity:0; animation:fade .34s ease-out 1.7s forwards;
    }

    /* sanfter Kamerazoom */
    .zoom{ position:absolute; inset:0; z-index:1; animation:softzoom 1.2s ease-out forwards; pointer-events:none; }

    /* Animations */
    @keyframes float   { from{ transform:translateY(0)   scale(1) } to{ transform:translateY(-28px) scale(1.05) } }
    @keyframes pop     { to  { opacity:1; transform:translateY(0)  scale(1) } }
    @keyframes fade    { to  { opacity:1 } }
    @keyframes softzoom{ from{ transform:scale(1) } to { transform:scale(1.02) } }
    @keyframes glow    { from{ box-shadow:0 18px 38px rgba(47,109,246,.35) }
                         to  { box-shadow:0 24px 64px rgba(47,109,246,.55) } }
    @keyframes shimmer { to  { transform:translateX(120%) } }

    /* Fade-out am Ende (nutzt body.fade-out) */
    body.fade-out .phone{ opacity:0; transition:opacity .5s ease; }

    /* Reduced Motion: ohne Bewegungen, sofort sichtbar */
    @media (prefers-reduced-motion: reduce){
      .o1,.o2,.zoom{ animation:none; }
      .badge,.cta-bubble,.cta-bubble::after,.rail{ animation:none; opacity:1; transform:none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="outro-wrap">
        <div class="zoom"></div>
        <div class="orb o1"></div>
        <div class="orb o2"></div>

        <div class="cta">
          <div class="badge">AI Council</div>
          <div class="cta-bubble">Comment your idea → swarm builds it.</div>
          <div class="cta-bubble small">Best one wins tomorrow.</div>
          <div class="rail">#aiswarm #imessage #shorts</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
    /* gleiche Länge wie zuvor – bei Bedarf anpassen */
    setTimeout(()=>{ document.body.classList.add('fade-out'); }, 4800);
  </script>
</body>
</html>
