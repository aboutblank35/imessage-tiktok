<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XOXO GOSSIP AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <!-- Statusleiste -->
    <div class="status-bar">
      <div>17:42</div>
      <div>📶 🔋</div>
    </div>

    <!-- Header -->
    <div class="header">
      <div class="back-btn">‹</div>
      <div class="header-center">
        <div class="group-title">6 KI-Berater</div>
        <div class="group-subtitle">XOXO GOSSIP AI</div>
      </div>
      <div class="call-btn">📹</div>
    </div>

    <!-- Chat -->
    <div class="chat-container">
      <div class="chat" id="chat">
        <!-- Nachrichten werden hier eingefügt -->
      </div>
    </div>

    <!-- Input-Bereich -->
    <div class="input-area">
      <div class="input-wrapper">
        <div class="attachment-btn">＋</div>
        <input type="text" placeholder="iMessage" disabled>
        <div class="camera-btn">📷</div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
