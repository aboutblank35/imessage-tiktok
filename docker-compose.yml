version: '3.8'
services:
  chat-recorder:
    build: .
    image: chat-recorder:latest
    devices:
      - /dev/snd
    group_add:
      - audio
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /tmp/pulse.sock:/tmp/pulse.sock
      - ./data:/home/recorder/data
    environment:
      DISPLAY: ':99'
      PULSE_SERVER: 'unix:/tmp/pulse.sock'
      PULSE_SOURCE: 'alsa_output.pci-0000_01_01.0.analog-stereo.monitor'
    command: sh -c "\
      Xvfb :99 -screen 0 720x1280x24 & \
      sleep 1 && \
      npm run start & \
      until curl -s http://localhost:3000 >/dev/null; do sleep 1; done && \
      sleep 1 && \
      node record/record.js"
    ports:
      - "3000:3000"
